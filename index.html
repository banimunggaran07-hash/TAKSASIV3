  <script>
    // Silently handle expected local websocket reconnect notices
    window.addEventListener('error', function(e) {
      if (e.message && (e.message.includes('websocket') || e.message.includes('connect_error') || e.message.includes('popup-closed-by-user') || e.message.includes('cancelled-popup-request'))) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    }, true);
    window.addEventListener('unhandledrejection', function(e) {
      if (e.reason && (String(e.reason).includes('websocket') || String(e.reason).includes('connect_error') || String(e.reason).includes('popup-closed-by-user') || String(e.reason).includes('cancelled-popup-request'))) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    }, true);

    // Initialize application credentials and theme safely without interfering with React DOM
    try {
      // Purge any legacy third-party storage items
      Object.keys(localStorage).forEach(function(k) {
        var lower = k.toLowerCase();
        if (lower.startsWith('base') && lower.indexOf('44') !== -1) {
          try { localStorage.removeItem(k); } catch (_) {}
        }
      });
      const savedTheme = localStorage.getItem("darkMode");
      const isDark = savedTheme === null ? true : savedTheme === "true";
      document.documentElement.classList.toggle("dark", isDark);
      document.documentElement.classList.toggle("light", !isDark);
      document.documentElement.style.colorScheme = isDark ? "dark" : "light";
    } catch (e) {
      console.warn("Storage initialization notice:", e);
    }

    // Register service worker for offline PWA capabilities
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      });
    }
  </script>
