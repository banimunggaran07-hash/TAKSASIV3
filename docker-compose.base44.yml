# Base44 sandbox/dev environment for Smart Taksasi.
# Runs the app from the cloned source with the bun lockfile; no prebuilt image.
services:
  web:
    image: oven/bun:1
    working_dir: /app
    command:
      - sh
      - -ec
      - bun install --frozen-lockfile && exec bunx tsx watch server.ts
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      - BASE44_PREVIEW_MODE
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: on-failure
