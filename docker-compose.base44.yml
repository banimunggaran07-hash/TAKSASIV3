# Base44 development environment for Smart Taksasi V2.1.3
#
# The app is a single self-contained Node.js/Express server (server.ts) that:
#   - serves the SPA from index.html + public/ on port 3000
#   - exposes its REST entity API under /api/* (WebSocket on the same port)
#   - persists data in data_store.json (bind-mounted, so it survives restarts)
#   - optionally talks to Cloud SQL PostgreSQL when SQL_* vars are set; without
#     them it uses the JSON store (the project's documented zero-setup mode)
#
# Runs FROM THE CLONED SOURCE via `tsx watch`, so edits to server.ts / src/** are
# live-reloaded. Dependencies are installed into a named volume on startup so the
# sandbox checkout never gets a node_modules directory.
services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
    # --no-package-lock: the repo pins dependencies with bun.lock; package-lock.json
    # is an empty stub. Without this flag npm rewrites that tracked file.
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund --no-package-lock && exec ./node_modules/.bin/tsx watch server.ts
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: on-failure
    labels:
      base44.project: "Smart Taksasi"
      base44.kind: "web"
      base44.port: "3000"

volumes:
  node_modules:
